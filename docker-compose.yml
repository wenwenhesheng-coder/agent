services:
  app:
    build:
      context: .
      args:
        INSTALL_ML_DEPS: ${INSTALL_ML_DEPS:-0}
    ports:
      - "8200:8200"
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-qwen}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      ZHIPU_API_KEY: ${ZHIPU_API_KEY:-}
      WENXIN_API_KEY: ${WENXIN_API_KEY:-}
      WENXIN_SECRET_KEY: ${WENXIN_SECRET_KEY:-}
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-1}
      TRANSFORMERS_OFFLINE: ${TRANSFORMERS_OFFLINE:-1}
    init: true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8200/health', timeout=5)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
