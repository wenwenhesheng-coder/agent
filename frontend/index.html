<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧银行理财顾问智能体</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh; display: flex; flex-direction: column;
        }
        .header {
            background: rgba(255,255,255,0.95); padding: 16px 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            display: flex; align-items: center; justify-content: space-between;
        }
        .header h1 { color: #1a237e; font-size: 22px; }
        .header .subtitle { color: #666; font-size: 13px; margin-top: 4px; }
        .badges { display: flex; gap: 8px; flex-wrap: wrap; }
        .badge {
            background: #e3f2fd; color: #1565c0; padding: 4px 10px;
            border-radius: 12px; font-size: 11px; font-weight: 600;
        }
        .main-container {
            flex: 1; display: flex; gap: 0; overflow: hidden;
        }
        .chat-panel {
            flex: 1; display: flex; flex-direction: column;
            background: rgba(255,255,255,0.95); margin: 16px;
            border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            overflow: hidden;
        }
        .side-panel {
            width: 360px; background: rgba(255,255,255,0.95); margin: 16px 16px 16px 0;
            border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            overflow-y: auto; padding: 16px;
        }
        .chat-header {
            background: #1a237e; color: white; padding: 12px 20px;
            font-size: 16px; font-weight: 600;
        }
        .chat-messages {
            flex: 1; overflow-y: auto; padding: 20px; display: flex;
            flex-direction: column; gap: 16px;
        }
        .message {
            max-width: 80%; padding: 12px 16px; border-radius: 12px;
            line-height: 1.6; font-size: 14px; white-space: pre-wrap; word-wrap: break-word;
        }
        .message.user {
            align-self: flex-end; background: #1a237e; color: white;
        }
        .message.assistant {
            align-self: flex-start; background: #f5f5f5; color: #333;
        }
        .message .meta { font-size: 11px; color: #999; margin-top: 8px; }
        .message .sources { font-size: 12px; color: #1565c0; margin-top: 8px; }
        .compliance-badge {
            display: inline-block; padding: 2px 8px; border-radius: 8px;
            font-size: 11px; font-weight: 600; margin-top: 4px;
        }
        .compliance-passed { background: #c8e6c9; color: #2e7d32; }
        .compliance-blocked { background: #ffcdd2; color: #c62828; }
        .chat-input-area {
            padding: 16px; border-top: 1px solid #e0e0e0; display: flex; gap: 12px;
        }
        .chat-input {
            flex: 1; padding: 12px 16px; border: 2px solid #e0e0e0;
            border-radius: 8px; font-size: 14px; outline: none;
            transition: border-color 0.3s;
        }
        .chat-input:focus { border-color: #1a237e; }
        .send-btn {
            padding: 12px 24px; background: #1a237e; color: white;
            border: none; border-radius: 8px; font-size: 14px;
            cursor: pointer; transition: background 0.3s;
        }
        .send-btn:hover { background: #3949ab; }
        .send-btn:disabled { background: #ccc; cursor: not-allowed; }
        .side-section { margin-bottom: 20px; }
        .side-section h3 {
            color: #1a237e; font-size: 14px; margin-bottom: 10px;
            border-bottom: 2px solid #e3f2fd; padding-bottom: 6px;
        }
        .thought-item {
            background: #f5f5f5; padding: 10px; border-radius: 8px;
            margin-bottom: 8px; font-size: 12px; border-left: 3px solid #1a237e;
        }
        .thought-item .agent { font-weight: 600; color: #1a237e; }
        .thought-item .thought-text { color: #555; margin-top: 4px; }
        .thought-item .action { color: #1565c0; margin-top: 2px; font-size: 11px; }
        .quick-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
        .quick-btn {
            background: #e3f2fd; color: #1565c0; border: 1px solid #bbdefb;
            padding: 6px 12px; border-radius: 16px; font-size: 12px;
            cursor: pointer; transition: all 0.3s;
        }
        .quick-btn:hover { background: #bbdefb; }
        .typing { color: #999; font-style: italic; }
        .report-display {
            background: white; border: 1px solid #e0e0e0; border-radius: 8px;
            padding: 16px; font-family: monospace; font-size: 12px;
            white-space: pre-wrap; max-height: 400px; overflow-y: auto;
        }
        .status-indicator {
            display: inline-block; width: 8px; height: 8px; border-radius: 50%;
            margin-right: 6px;
        }
        .status-ok { background: #4caf50; }
        .status-loading { background: #ff9800; animation: pulse 1s infinite; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
        .user-id-input {
            padding: 6px 10px; border: 1px solid #ddd; border-radius: 6px;
            font-size: 12px; width: 120px;
        }
    </style>
</head>
<body>
    <div class="header">
        <div>
            <h1>智慧银行理财顾问智能体</h1>
            <div class="subtitle">基于大模型技术的多智能体协同理财顾问系统</div>
        </div>
        <div class="badges">
            <span class="badge">多智能体协同</span>
            <span class="badge">Agentic RAG</span>
            <span class="badge">大小模型协同</span>
            <span class="badge">合规硬隔离</span>
            <span class="badge">XAI可解释</span>
            <span class="badge">数据脱敏</span>
        </div>
        <div>
            <span class="status-indicator" id="statusDot"></span>
            <input class="user-id-input" id="userId" value="user_001" placeholder="用户ID">
        </div>
    </div>

    <div class="main-container">
        <div class="chat-panel">
            <div class="chat-header">理财顾问对话</div>
            <div class="chat-messages" id="chatMessages">
                <div class="message assistant">
                    您好！我是智慧银行理财顾问智能体，可以为您提供个性化的理财配置科普建议。<br><br>
                    我的能力包括：<br>
                    - 多轮对话理财咨询<br>
                    - 风险测评与画像构建<br>
                    - 市场环境分析<br>
                    - 个性化资产配置方案（大小模型协同）<br>
                    - 收益测算与风险量化<br>
                    - 合规审查与风险提示<br><br>
                    所有建议均经过合规校验，推理过程可追溯。请问有什么可以帮您？
                </div>
            </div>
            <div class="quick-actions" style="padding: 0 16px;">
                <button class="quick-btn" onclick="sendQuick('我月薪5000怎么理财')">月薪5000怎么理财</button>
                <button class="quick-btn" onclick="sendQuick('帮我做风险测评')">帮我做风险测评</button>
                <button class="quick-btn" onclick="sendQuick('当前市场环境怎么样')">当前市场环境</button>
                <button class="quick-btn" onclick="sendQuick('我是稳健型投资者，推荐适合我的产品')">稳健型推荐产品</button>
                <button class="quick-btn" onclick="sendQuick('1万元存3年能赚多少')">1万存3年收益测算</button>
                <button class="quick-btn" onclick="sendQuick('资管新规有什么要求')">资管新规解读</button>
            </div>
            <div class="chat-input-area">
                <input class="chat-input" id="chatInput" placeholder="请输入您的理财问题..."
                    onkeypress="if(event.key==='Enter') sendMessage()">
                <button class="send-btn" id="sendBtn" onclick="sendMessage()">发送</button>
            </div>
        </div>

        <div class="side-panel">
            <div class="side-section">
                <h3>推理链（XAI可解释）</h3>
                <div id="reasoningChain">
                    <div style="color:#999;font-size:12px;">发送消息后显示推理过程</div>
                </div>
            </div>
            <div class="side-section">
                <h3>合规审查</h3>
                <div id="complianceStatus">
                    <div style="color:#999;font-size:12px;">待审查</div>
                </div>
            </div>
            <div class="side-section">
                <h3>数据来源（抑制幻觉）</h3>
                <div id="dataSources">
                    <div style="color:#999;font-size:12px;">无</div>
                </div>
            </div>
            <div class="side-section">
                <h3>执行步骤</h3>
                <div id="stepsExecuted">
                    <div style="color:#999;font-size:12px;">无</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 支持本地开发默认使用同源 API；部署静态前端后，可通过 ?api= 或 localStorage 指向远程 FastAPI。
        const apiFromQuery = new URLSearchParams(window.location.search).get('api');
        if (apiFromQuery) {
            localStorage.setItem('advisor_api_base', apiFromQuery.replace(/\/$/, ''));
        }
        const API_BASE = (apiFromQuery || localStorage.getItem('advisor_api_base') || '/api').replace(/\/$/, '');
        let isProcessing = false;

        function setStatus(loading) {
            const dot = document.getElementById('statusDot');
            dot.className = 'status-indicator ' + (loading ? 'status-loading' : 'status-ok');
        }

        function addMessage(role, content, meta) {
            const container = document.getElementById('chatMessages');
            const div = document.createElement('div');
            div.className = 'message ' + role;
            let html = content.replace(/\n/g, '<br>');
            if (meta) {
                if (meta.compliance_passed !== undefined) {
                    const cls = meta.compliance_passed ? 'compliance-passed' : 'compliance-blocked';
                    const txt = meta.compliance_passed ? '合规通过' : '合规拦截';
                    html += `<div><span class="compliance-badge ${cls}">${txt}</span></div>`;
                }
                if (meta.data_sources && meta.data_sources.length > 0) {
                    html += `<div class="sources">来源: ${meta.data_sources.join(', ')}</div>`;
                }
                if (meta.user_risk_level) {
                    html += `<div class="meta">用户风险等级: ${meta.user_risk_level}</div>`;
                }
            }
            div.innerHTML = html;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function updateReasoningChain(chain) {
            const container = document.getElementById('reasoningChain');
            if (!chain || chain.length === 0) {
                container.innerHTML = '<div style="color:#999;font-size:12px;">无推理记录</div>';
                return;
            }
            container.innerHTML = chain.map((t, i) => `
                <div class="thought-item">
                    <div class="agent">步骤${i+1} [${t.agent}]</div>
                    <div class="thought-text">${t.thought || ''}</div>
                    ${t.action ? `<div class="action">动作: ${t.action}</div>` : ''}
                    ${t.observation ? `<div class="action">观察: ${t.observation.substring(0,120)}...</div>` : ''}
                </div>
            `).join('');
        }

        function updateCompliance(compliance) {
            const container = document.getElementById('complianceStatus');
            if (!compliance) {
                container.innerHTML = '<div style="color:#999;font-size:12px;">无</div>';
                return;
            }
            const cls = compliance.passed ? 'compliance-passed' : 'compliance-blocked';
            const txt = compliance.passed ? '合规通过' : '合规拦截';
            let html = `<span class="compliance-badge ${cls}">${txt}</span>`;
            if (compliance.violations && compliance.violations.length > 0) {
                html += '<div style="margin-top:8px;color:#c62828;font-size:12px;">违规项:</div>';
                html += compliance.violations.map(v => `<div style="font-size:11px;color:#c62828;">- ${v}</div>`).join('');
            }
            container.innerHTML = html;
        }

        function updateSources(sources) {
            const container = document.getElementById('dataSources');
            if (!sources || sources.length === 0) {
                container.innerHTML = '<div style="color:#999;font-size:12px;">无</div>';
                return;
            }
            container.innerHTML = sources.map(s => `<div style="font-size:12px;color:#1565c0;margin-bottom:4px;">- ${s}</div>`).join('');
        }

        function updateSteps(steps) {
            const container = document.getElementById('stepsExecuted');
            if (!steps || steps.length === 0) {
                container.innerHTML = '<div style="color:#999;font-size:12px;">无</div>';
                return;
            }
            container.innerHTML = steps.map((s,i) => `<div style="font-size:12px;margin-bottom:4px;">${i+1}. ${s}</div>`).join('');
        }

        function sendQuick(msg) {
            document.getElementById('chatInput').value = msg;
            sendMessage();
        }

        async function sendMessage() {
            if (isProcessing) return;
            const input = document.getElementById('chatInput');
            const msg = input.value.trim();
            if (!msg) return;
            const userId = document.getElementById('userId').value || 'demo_user';

            addMessage('user', msg);
            input.value = '';
            isProcessing = true;
            setStatus(true);
            document.getElementById('sendBtn').disabled = true;

            // 显示加载中
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'message assistant typing';
            loadingDiv.id = 'loadingMsg';
            loadingDiv.textContent = '智能体思考中...（多Agent协同 + 合规审查）';
            document.getElementById('chatMessages').appendChild(loadingDiv);

            try {
                const resp = await fetch(`${API_BASE}/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: userId, message: msg }),
                });
                const data = await resp.json();

                document.getElementById('loadingMsg').remove();
                addMessage('assistant', data.response, data);
                updateReasoningChain(data.reasoning_chain);
                updateCompliance({ passed: data.compliance_passed, violations: data.compliance_violations });
                updateSources(data.data_sources);
                updateSteps(data.steps_executed);
            } catch (e) {
                document.getElementById('loadingMsg').remove();
                addMessage('assistant', '抱歉，处理您的请求时出现错误：' + e.message);
            } finally {
                isProcessing = false;
                setStatus(false);
                document.getElementById('sendBtn').disabled = false;
            }
        }

        // 初始化状态
        setStatus(false);
        fetch(`${API_BASE}/system/status`).then(r => r.json()).then(d => {
            console.log('系统状态:', d);
        }).catch(e => console.log('状态获取失败'));
    </script>
</body>
</html>
